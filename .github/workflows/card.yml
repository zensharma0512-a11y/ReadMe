name: Update profile stats cards

on:
  schedule:
    - cron: "35 18 * * *" # daily, just after midnight IST
  workflow_dispatch:
  push:
    paths:
      - "card/generate.py"
      - ".github/workflows/card.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cards from live GitHub stats
        env:
          # Optional: add a CARD_TOKEN secret (personal access token) to count
          # private repos too. Without it, public stats are used.
          GITHUB_TOKEN: ${{ secrets.CARD_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 card/generate.py

      - name: Commit the updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card/*.svg
          if git diff --cached --quiet; then
            echo "Cards unchanged"
          else
            git commit -m "Update profile stats cards"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
